  active: true
  corrected_by: The dash is on the wrong side, exactly as it was for -bāž. The source writes "-andar (darun)",
    but its own example andarāmadan (اندرآمدن) puts it in front, and every neighbouring row in the same
    block of the verb table — bar-, bāz-, dar-, farā-, foru-, ham- — is a prefix. اندر is the preposition
    *inside*, and Persian puts it before the verb. **Ruled here and not in affix_spellings.yaml, because
    the spelling is two different affixes.** The nominal table writes "-andar (nātani)" at row 38 — N-038,
    the step-kin ending, whose example Mādarandar (مادراندر) puts it on the end and is right to. Correcting
    the affix table moved both, which is how the difference was noticed. Unconfirmed by the linguist;
    see FOR_THE_LINGUIST.
