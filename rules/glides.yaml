version: 0.1.0
rules:
- id: G-01
  source:
    table: glides
    row: '2'
  left: ā
  right: e
  result: āye
  examples: []
  explanation_fa: هنگام برخورد ā و e واج‌میانجی می‌آید و āye ساخته می‌شود
  active: false
  retired_reason: 'Duplicate of G-03. Both state "ā meets e gives āye", and G-03''s example (Pā + e =
    Pāye) fits. G-01''s example (ā + ande = Āyande) does not: the ending -ande begins with **a**, not
    e, and the result is Āyande, not Āyende. That example is really an instance of the ā-meets-a rule,
    which the document already lists unnumbered as G-04. So the example moves to G-04 and G-01 is retired
    rather than deleted.'
  retired_reason_fa: 'همان G-03 است: هر دو می‌گویند آ که با اِ برخورد کند «āye» می‌شود. نمونهٔ G-01 یعنی
    ā + ande = Āyande به این دستور بازنمی‌گردد، زیرا پایانهٔ ande- با «a» آغاز می‌شود نه با «e». آن نمونه
    به G-04 برده شد و این دستور بازنشسته شد، نه پاک.'
