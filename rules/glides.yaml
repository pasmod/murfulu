- id: G-15
  source:
    table: glides
    row: '15'
  left: ow
  right: a
  result: av
  examples:
  - row + am = ravam
  - šow + am = šavam
  explanation_fa: هنگام برخورد ow و a واج‌میانجی می‌آید و av ساخته می‌شود
  active: false
  retired_reason: Superseded by the stem_finals rule above. This row said "ow + a gives av" — one instance
    of the broader fact that a stem written *ow* is *av* whenever anything follows. Its example, row +
    am = ravam, still comes out right, now without a joining rule.
  retired_reason_fa: 'در دستوری کلی‌تر گنجید: بنی که «ow» نوشته می‌شود، هرگاه چیزی پس از آن بیاید «av»
    است. نمونهٔ آن (row + am = ravam) همچنان درست ساخته می‌شود، بی‌آنکه به دستور میانجی نیازی باشد.'
