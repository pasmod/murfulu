# Semantic tags — the closed set taken from the brackets in the source grammar.
#
# Every bracketed string in the affix column of either rule table appears here
# exactly once. Nothing was merged except differences of capitalisation
# (kenār / Kenār), which are the same word.
#
# Fields
#   tag                 machine id: the Latin label, lower-cased and ASCII-folded
#   label_source        every spelling the document uses, verbatim
#   gloss_fa/gloss_en   what the tag word means
#   gloss_template_fa   the sentence shown to the user for a word carrying this
#                       tag, e.g. "جایی که {stem} در آن است". **Authored by the
#                       linguist, not by the engine.** null until then.
#   used_by             source rows, as table:row
#
# Two things need a ruling before the templates are written — both marked with
# needs_expert_check below:
#   1. manand / manandi and nai / nayi look like the same tag spelled two ways.
#   2. The lower-case labels (bālā, pāyin, darun, pas …) may be plain-language
#      glosses of a prefix rather than tag names. In Behnevis a name is
#      capitalised, and these are not.

