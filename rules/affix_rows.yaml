# Which rule id each row of the linguist's 2026-11-19 rules document is.
#
# **Why this file exists.** The corrected rules (`rules/affix_source_rows.json`,
# transcribed verbatim by tools/extract_affix_tables.py) replace the August
# grammar's two rule tables. They are ordered by affix rather than by input and
# numbered 1–229 across three tables, so the August row numbers — which the V
# and N ids mirror — do not carry over. Ids are permanent (docs/RULE_PACK.md),
# so which new row is which old rule is a judgement, and a judgement belongs in
# an authored file rather than in code. This is that file.
#
# **Same rule, same id.** A row keeps an existing id when it is the same rule:
# the same affix, the same meaning, and the same base — judged by the row's own
# examples, which is what the August row and the new one have in common when
# the wording around them moved. A row that relabels its base or its result but
# keeps the August row's examples is the same rule corrected, and keeps the id
# (the `change` note says what moved). A row with no August counterpart gets a
# new id, appended to its family in document order: N if its base is a nominal
# class, V if it is a verb stem, an infinitive, a participle or an inflected
# verb. An August rule with no row here is **retired**, never deleted and never
# reused: it keeps its id, its August transcription and a reason.
#
# **Two rows repeat another.** Row 10 is row 9 again with one example fewer,
# and row 132 is row 120 cell for cell; each is recorded `same_as` and builds
# no rule of its own.
#
# **One number is written twice.** The prefix table numbers its 48th row "46"
# a second time; `position` (the row's place in the table) tells the two apart.
# The linguist's number is kept as he wrote it.
#
# Read by tools/assign_rule_ids.py (new ids into rules/rule_ids.json) and
# tools/build_rule_pack.py (the pack). Decided 2026-11-19; see DECISIONS.

