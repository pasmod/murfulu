  # -- 2026-11-19: be- on a verb is written ب --------------------------------
  - id: V-087
    affix_fa: "ب"
    ruled_on: 2026-11-19
    reason: >-
      Row 33, «be- (Barjastesāzi)», puts be- on a verb: beraften, bešodan,
      bexordan — بخوردن, بشدن, written joined with ب. The affix table spells
      be- به, which is right before a noun (N-004, bexrad) and would build
