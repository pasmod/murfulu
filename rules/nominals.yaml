  label_fa: نام + -í
  explanation_fa: از نام با پسوند -í نام ساخته می‌شود
  active: false
  retired_reason: 'Not word formation: this is the indefinite enclitic. The row''s own example is the
    argument — `Ketābí` is کتابی, *a book*, the same word with an article on it. Run as a suffix it produced
    14,074 forms in v4, 269 of them counted as attested against the base''s own spelling, and it reached
    بلندی by the wrong route: بلندی is the abstract noun, not *a tall one*, so the right word arrived
    filed under the wrong rule with a borrowed count. Unconfirmed, per the project''s working rule — the
    row keeps its id and its transcription and is simply not run. Registered as FOR_THE_LINGUIST L8; one
    line brings it back.'
  retired_reason_fa: 'واژه‌سازی نیست: این «ی» نکره است. نمونهٔ خودِ این ردیف گواه آن است — «کتابی» همان
    واژه است با نشانهٔ نکره بر آن. اگر همچون پسوند اجرا شود، به «بلندی» از راه نادرست می‌رسد: بلندی نامِ
    معناست، نه «یک بلند». هنوز تأیید نشده است؛ شناسه و آوانگاشت بر جای مانده و تنها اجرا نمی‌شود.'
