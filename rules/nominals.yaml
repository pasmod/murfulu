- id: N-090
  source:
    table: nominals
    row: '90'
  kind: suffix
  affix: -é
  affix_source: -é
  affix_fa: ِ
  affix_variants: []
  input:
    types:
    - nam
    condition_text: Nām
  output:
    types:
    - nam
  semantic_tags:
  - Vābastegi
  strength: null
  examples:
  - Ketābé
  - u
  label_fa: نام + -é
  explanation_fa: از نام با پسوند -é نام ساخته می‌شود
  active: false
  retired_reason: 'Not word formation: this is the ezāfe. The row''s own example is the argument — `Ketābé`
    `u` is کتابِ او, two words joined by a کسره, not one word. Run as a suffix it hung a کسره on every
    noun, stacked on itself (Balandéé), and inherited the base''s corpus count, because the corpus writes
    no کسره: 14,074 forms in v4, 1,983 of them counted as attested. Unconfirmed, per the project''s working
    rule — the row keeps its id and its transcription and is simply not run. Registered as FOR_THE_LINGUIST
    L8; one line brings it back.'
  retired_reason_fa: 'واژه‌سازی نیست: این کسرهٔ اضافه است. نمونهٔ خودِ این ردیف گواه آن است — «کتابِ او»
    دو واژه است که با کسره به هم پیوسته‌اند، نه یک واژه. اگر همچون پسوند اجرا شود، بر هر نامی کسره می‌نشاند،
    بر خودش سوار می‌شود، و شمار پیکرهٔ پایه را نیز به ارث می‌برد، زیرا پیکره کسره نمی‌نویسد. هنوز تأیید
    نشده است؛ شناسه و آوانگاشتِ ردیف بر جای مانده و تنها اجرا نمی‌شود.'
