  - reference: L10c
    blocks_work: true
    question_en: >-
      May the base word's meaning in a template come from Dehkhoda, through the
      definitions karbon's lexicon carries?
    question_fa: |
      جملهٔ معنا گاهی به معنای خود واژهٔ پایه نیاز دارد، نه تنها به خود واژه. پایگاه کربن برای بیشتر مدخل‌ها آغاز تعریف لغت‌نامهٔ دهخدا را نگه می‌دارد، و می‌توانیم معنای واژهٔ پایه را از آنجا برداریم.

      این راه سه محدودیت دارد. تعریف دهخدا در پایگاه کربن پس از ۲۰۰ نویسه بریده شده است، در ۱۹٬۳۱۱ مدخل از ۵۷٬۲۱۱ مدخلی که تعریف دارند. بسیاری از تعریف‌ها با ریشه‌شناسی آغاز می‌شوند و نه با معنا؛ برای نمونه تعریف «امید» با «در پهلوی، اُمِت» آغاز می‌شود. و گاهی معنای نخست کم‌کاربرد است: تعریف «فنا» در پایگاه دربارهٔ گیاهی دارویی است، نه دربارهٔ نیستی.

      پرسش: آیا معنای واژهٔ پایه را می‌توانیم از تعریف دهخدا در پایگاه کربن بگیریم؟

      پیشنهاد ما: گزینهٔ نخست، چون تعریف دهخدا بریده است و اغلب با ریشه‌شناسی آغاز می‌شود، و تنها پس از کوتاه‌کردن و بازبینی به کار جملهٔ معنا می‌آید.
    choices:
      - id: yes_reviewed
        suggested: true
        text_fa: >-
          آری، ولی تنها پس از بازبینی: معنایی که از دهخدا برداشته می‌شود، پیش از آنکه در جمله‌ای به خواننده نشان داده شود، باید کوتاه و بازبینی شود.
      - id: yes_direct
        text_fa: >-
          آری؛ معنای واژهٔ پایه مستقیم از تعریف دهخدا برداشته شود و همان در جمله بنشیند.
      - id: base_word_only
        text_fa: >-
          نه؛ در جملهٔ معنا خود واژهٔ پایه بیاید، مانند «جایی که نمک در آن است»، و از تعریف دهخدا استفاده نشود.
      - id: other_source
        text_fa: >-
          نه؛ معنا از منبع دیگری گرفته شود که آن را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L26
    covers: [L18, L26, L35]
    blocks_work: true
    defer: >-
      شما قاعده‌ها را بازنگری می‌کنید و پاسخ این پرسش به قاعده‌های تازه بستگی دارد؛ تا آن زمان برنامه «نام» را مانند امروز تنها نام می‌گیرد.
    question_en: >-
      Does «نام» in the rule table mean a nām only, or a nām or a kārnām? With
      the word bank, 10,645 words are kārnām only; دانشمند، امیدوار، هوشمند and
      هوشواره cannot be built. Deferred until the corrected rules arrive.
    question_fa: |
      در جدول‌های قاعده، ۸۰ قاعده پایهٔ خود را «نام» نوشته‌اند و تنها یک قاعده، یعنی N-098 با پسوند ـی، کارنام می‌پذیرد. قاعده‌های ترکیبی‌ای هم که واژه‌ای را مستقیم به کنون‌کاربن می‌پیوندند، مانند سخنگو (soxanguy)، و قاعدهٔ N-104 (Sarāsar) جای نام را «نام» نوشته‌اند.

      در بانک واژهٔ شما ۱۰٬۸۶۶ واژه کارنام‌اند، و ۱۰٬۶۴۵ تا از آن‌ها تنها کارنام‌اند و نام نیستند؛ امید، هنر، سخن، دانش و هوش از این دسته‌اند. بنابراین موتور هیچ‌یک از این واژه‌ها را به قاعده‌ای که نام می‌خواهد نمی‌دهد.

      نتیجه این است که چند قاعده نمونهٔ خودشان را نمی‌توانند بسازند: دانشمند (dānešmand) با ـمند، امیدوار (omidvār) با ـوار، دانشگاه (Dānešgāh) با ـگاه، دانشور (dānešvar) با ـور، و سخنگو (soxanguy). واژه‌های کهنی مانند هوشمند، بیهوش و باهوش هم ساخته نمی‌شوند. «هوشواره» (Hušvāre)، که در سال ۲۰۲۶ برای «هوش مصنوعی» پیشنهاد شده، درست مانند گوشواره و جشنواره ساخته شده است، و تنها فرقش این است که گوش و جشن نام‌اند و هوش کارنام.

      اگر «نام» در این جدول کارنام را هم دربر بگیرد، همهٔ این واژه‌ها ساخته می‌شوند. بهای آن این است که شمار واژه‌هایی که برنامه می‌سازد نزدیک به ده برابر می‌شود، از نزدیک به سه میلیون به ۲۹ میلیون، و پیوندهای نادرست هم بیشتر می‌شوند.

      پرسش: «نام» در جدول قاعده‌ها، چه در قاعده‌های پسوندی و چه در قاعده‌های ترکیبی، تنها نام را می‌خواهد یا کارنام را هم دربر می‌گیرد؟
    choices:
      - id: nam_or_karnam
        text_fa: >-
          «نام» در این جدول هم نام را دربر می‌گیرد و هم کارنام را؛ پس هر قاعده‌ای که نام می‌پذیرد کارنام را هم بپذیرد.
      - id: some_rules
        text_fa: >-
          تنها برخی از قاعده‌ها کارنام را هم می‌پذیرند؛ آن قاعده‌ها را در جعبهٔ متن می‌نویسم، و قاعده‌های دیگر تنها نام بپذیرند.
      - id: karbon_class
        text_fa: >-
          «نام» در این جدول تنها نام است، ولی امید، هنر، سخن، دانش، هوش و واژه‌های مانند آن‌ها نام‌اند و نه کارنام؛ پس گروه این واژه‌ها در بانک واژه باید درست شود و قاعده‌ها دست نخورند.
      - id: nam_only
        text_fa: >-
          «نام» در این جدول تنها نام است و کارنام را دربر نمی‌گیرد؛ این نمونه‌ها از راه دیگری ساخته می‌شوند که آن را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L36
    blocks_work: false
    question_en: >-
      The build screen now gives every built word one of three levels —
      familiar, well-formed, weakly backed — by lines we drew ourselves (ten
      poems; the lowest third of the rules). Are the names right for a reader
      who is not a linguist, and are the lines in the right place?
    question_fa: |
      صفحهٔ ساخت واژه اکنون برای هر واژه‌ای که می‌سازد یکی از سه درجه را نشان می‌دهد، با یک جمله که دلیل آن را می‌گوید. این درجه‌ها و مرزهایشان را ما گذاشته‌ایم و هنوز به تأیید شما نرسیده‌اند:
      آشنا: واژه با همین خوانش دست‌کم در ده سرودهٔ پیکره آمده است، مانند دانا (dānā) که در ۲٬۱۱۸ سروده آمده است.
      خوش‌ساخت: واژه کم آمده یا نیامده است، ولی هیچ‌یک از قاعده‌هایی که آن را ساخته‌اند در یک‌سوم پایینیِ قاعده‌ها نیست، یعنی در آن یک‌سوم که کمتر از همه واژه‌ای ساخته‌اند که در پیکره آمده باشد؛ مانند دانگر (dāngar)، چون پسوند ـگر ۱۳۹ واژه ساخته که در پیکره آمده‌اند.
      کم‌پشتوانه: واژه کم آمده یا نیامده است، و یکی از قاعده‌هایش در آن یک‌سوم است؛ مانند زیردانا (zirdānā)، چون پیشوند زیر از ۷٬۸۳۰ واژه‌ای که ساخته، تنها یکی را در پیکره دارد.

      پیکره شعر کهن است. پیشوندی مانند «هم» در شعر کهن کم واژه ساخته و امروز بسیار به کار می‌رود، و از این رو واژه‌ای مانند هماندیشنده (hamandišande) کم‌پشتوانه به شمار می‌آید.

      پرسش: آیا این سه نام برای خواننده‌ای که زبان‌شناس نیست درست‌اند، و آیا مرز ده سروده و مرز یک‌سوم پایینیِ قاعده‌ها به‌جا هستند؟

      پیشنهاد ما: گزینهٔ نخست، چون هر سه نام واژه‌های روزمره‌اند و هر دو مرز از خود پیکره و از شمار واژه‌های هر قاعده گرفته شده‌اند، نه از داوری ما دربارهٔ تک‌تک واژه‌ها.
    choices:
      - id: keep
        suggested: true
        text_fa: >-
          نام‌ها و مرزها همین‌گونه بمانند.
      - id: other_names
        text_fa: >-
