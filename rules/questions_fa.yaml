  - reference: L17
    blocks_work: true
    question_en: Is جانام (Jānām) the right term for the pronoun?
    question_fa: |
      در برنامه، رده‌های دستوری با واژه‌های خود شما نام برده می‌شوند. هشت واژه را از نوشتهٔ شما برداشته‌ایم: کاربن یک، کاربن دو، نابِسودکارواژه، کارنام، نام، برنام، کارنده‌کاربهر و کاریده‌کاربهر، و «چون‌واژه» را هم خودتان روشن کرده‌اید. ولی برای چند رده واژه‌ای در جدول شما نبود و ما آن را از روی لاتینِ سند خوانده‌ایم.

      برای ضمیر، سند در ردیف‌های قاعده Jānām می‌نویسد. ما آن را «جانام» (جا + نام) نوشته‌ایم و همهٔ صفحه‌ها همین را نشان می‌دهند. «جانام» دو هجا دارد، در جدول قاعده‌ها پنج بار آمده است و همان معنای «واژه‌ای که به جای نام می‌نشیند» را می‌رساند. «جای‌نام» را کنار گذاشتیم، چون در فارسی امروز نام یک مکان را می‌رساند.

      پرسش: آیا «جانام» واژهٔ درست برای ضمیر است؟
    choices:
