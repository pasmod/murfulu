  - reference: L10c
    blocks_work: true
    question_en: >-
      May the base word's meaning in a template come from Dehkhoda, through the
      definitions karbon's lexicon carries?
    question_fa: |
      جملهٔ معنا گاهی به معنای خود واژهٔ پایه نیاز دارد، نه تنها به خود واژه. پایگاه کربن برای بیشتر مدخل‌ها آغاز تعریف لغت‌نامهٔ دهخدا را نگه می‌دارد، و می‌توانیم معنای واژهٔ پایه را از آنجا برداریم.

      این راه سه محدودیت دارد. تعریف دهخدا در پایگاه کربن پس از ۲۰۰ نویسه بریده شده است، در ۱۴٬۹۸۲ مدخل از ۴۳٬۸۰۸ مدخل. بسیاری از تعریف‌ها با ریشه‌شناسی آغاز می‌شوند و نه با معنا؛ برای نمونه تعریف «امید» با «در پهلوی، اُمِت» آغاز می‌شود. و گاهی معنای نخست کم‌کاربرد است: تعریف «فنا» در پایگاه دربارهٔ گیاهی دارویی است، نه دربارهٔ نیستی.

      پرسش: آیا معنای واژهٔ پایه را می‌توانیم از تعریف دهخدا در پایگاه کربن بگیریم؟
    choices:
