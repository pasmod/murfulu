  - reference: L17d
    blocks_work: true
    question_en: >-
      The twelve one-line explanations of the word classes are ours and none is
      confirmed. Are they right?
    question_fa: |
      برنامه باید بی هیچ راهنمایی بگوید هر ردهٔ دستوری چیست، و هیچ توضیحی در داده‌ها نبود. بنابراین برای هر رده یک خط فارسی نوشته‌ایم و در آن تنها واژه‌های خود شما را به کار برده‌ایم، تا توضیح واژه‌های کهنه‌ای را که جایگزین کرده‌اید دوباره به میان نیاورد. شما هیچ‌یک از این دوازده خط را تأیید نکرده‌اید:
      کاربن یک: بنِ گذشتهٔ کارواژه؛ آنچه با برداشتنِ «ـن» از نابِسودکارواژه بر جای می‌ماند.
      کاربن دو: بنِ اکنونِ کارواژه؛ بنی که فرمان و زمانِ حال بر آن ساخته می‌شود.
      نابِسودکارواژه: کارواژه در ریختِ بنیادین و بی‌گردانش، مانندِ «رفتن».
      کارنام: خودِ کار، که همچون نام آورده می‌شود، مانندِ «گفتار».
      نام: واژه‌ای که بر کس یا چیز یا مفهومی دلالت می‌کند.
      برنام: واژه‌ای که چگونگیِ نام را می‌گوید.
      کارنده‌کاربهر: آن که کار را انجام می‌دهد، مانندِ «رونده».
      کاریده‌کاربهر: آن که کار بر او انجام شده است، مانندِ «گفته».
      چون‌واژه: واژه‌ای که چگونگی یا زمان یا جایِ کار را می‌گوید.
      جانام: واژه‌ای که به جایِ نام می‌نشیند.
      پیش‌واژه: واژه‌ای که پیش از نام می‌آید و پیوندِ آن را با دیگر بخش‌های جمله می‌رساند.
      ندایی: ریختی که با آن کسی یا چیزی را می‌خوانند.

      پرسش: آیا این دوازده توضیح درست‌اند، و هیچ‌یک بیش از آنچه رده هست نمی‌گوید؟
    choices:
      - id: all_right
        text_fa: >-
          هر دوازده توضیح درست‌اند و همان‌گونه که هستند در برنامه می‌مانند.
      - id: some_fix
        text_fa: >-
          برخی از توضیح‌ها باید تغییر کنند؛ آن‌ها را با متن درست در جعبهٔ متن می‌نویسم، و بقیه می‌مانند.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L10
    blocks_work: true
    question_en: >-
      May the meaning template hang on each rule instead of on the shared
      semantic tag? Under `Jā`, نمکدان، گلستان، میکده and دانشگاه get one
      sentence.
    question_fa: |
      می‌خواهیم کنار هر واژه‌ای که موتور می‌سازد، معنای آن را هم در یک جمله بنویسیم. این جمله از یک الگو ساخته می‌شود که واژهٔ پایه در آن می‌نشیند؛ برای نمونه «جایی که نمک در آن است» برای نمکدان.

      امروز این الگو به برچسب معنایی بسته است، و یک برچسب میان چند قاعده مشترک است. برچسب «جا» را پنج پسوند دارند: ـان، ـدان، ـستان، ـکده و ـگاه. پس نمکدان، گلستان، میکده و دانشگاه همه یک جمله می‌گیرند، در حالی که نمکدان ظرف است، گلستان سرزمین است، میکده خانه است و دانشگاه نهاد. قاعدهٔ N-068 با پسوند ـگاه هم‌زمان برچسب «جا» و «زمان» را دارد، پس «سحرگاه» را هم جا می‌خواند.

      شما پیش‌تر گفته‌اید که هر پسوند معنای خود را دارد و برخی پسوندها، مانند ـِش، چند معنا دارند. اگر الگو به هر قاعده بسته شود، نزدیک به ۱۹۳ جمله باید نوشته شود؛ اگر به برچسب بسته بماند، ۴۳ جمله.

      پرسش: آیا جملهٔ الگوی معنا می‌تواند به هر قاعده بسته شود، به‌جای برچسب معنایی‌ای که چند قاعده با هم دارند؟
    choices:
      - id: per_rule
        text_fa: >-
          آری؛ هر قاعده جملهٔ الگوی خود را دارد، و قاعده‌ای که چند معنا دارد می‌تواند بیش از یک جمله داشته باشد.
      - id: tag_with_override
        text_fa: >-
          هر برچسب یک جملهٔ کلی دارد، و تنها جایی که قاعده‌ای معنای ویژهٔ خود را دارد، جملهٔ آن قاعده جای جملهٔ برچسب را می‌گیرد.
      - id: per_tag
        text_fa: >-
          نه؛ الگو به برچسب معنایی بسته بماند، و قاعده‌هایی که یک برچسب دارند یک جمله را با هم به کار ببرند.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

