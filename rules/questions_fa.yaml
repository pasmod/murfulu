    question_fa: |
      جدول کارواژه‌های شما دو قاعده دارد که با «ـاندن» از کاربن دو نابِسودکارواژهٔ تازه می‌سازند. قاعدهٔ V-001 پایه را «کاربن دوِ ناگذرا از گروه یک» می‌خواند، با نمونه‌های oftāndan و parāndan، و قاعدهٔ V-002 «کاربن دوِ ناگذرا از گروه دو»، با نمونه‌های pazāndan و pazānidan.

      شما در نوشتهٔ واج‌نویسی V.7 هر نابِسودکارواژه را بر پایهٔ دستوری که کاربن دوِ آن را می‌سازد در سه گروه جای داده‌اید، و پایگاه کربن همین گروه را برای هر کارواژه نگه می‌دارد. نمونه‌های V-001 با این تقسیم می‌خوانند: افتادن و پریدن هر دو در گروه یک‌اند.

      ولی نمونهٔ V-002، یعنی pazāndan، از «پز» ساخته شده است، و «پز» در کربن یا کاربن دوِ «پختن» است که در گروه سه جای دارد (دستور ۳۹)، یا کاربن دوِ «پزیدن» که در گروه یک است (دستور ۶). گروه دو در کربن تنها ده کارواژه دارد، مانند زدن، چیدن، بستن و گشتن، و پختن در میان آن‌ها نیست.

