        settles: false

  - reference: L17b
    blocks_work: true
    question_en: >-
      پیش‌واژه for the preposition: را follows its noun, and the word is close
      to پیشوند. Keep it, or بندواژه?
    question_fa: |
      در برنامه، رده‌های دستوری با واژه‌های خود شما نام برده می‌شوند. برای حرف اضافه واژه‌ای در جدول شما نبود، و ما آن را از روی لاتینِ سند (Pišvāže) «پیش‌واژه» نوشته‌ایم.

      دو چیز در برابر «پیش‌واژه» هست. نخست اینکه «را» هم حرف اضافه است، ولی پس از نام می‌آید و نه پیش از آن. دوم اینکه «پیش‌واژه» به «پیشوند» نزدیک است، و در برنامه‌ای که پر از پیشوند است این دو با هم اشتباه می‌شوند؛ نمونهٔ قاعدهٔ N-084 خودش Pišvand است.

      جایگزینی که به ذهن ما رسید «بندواژه» است. این واژه پیوند را می‌رساند و نه جایگاه را، و با «را» هم جور درمی‌آید، ولی «بند» چند معنا دارد و باید آموخته شود.

      پرسش: برای حرف اضافه کدام واژه را در برنامه به کار ببریم؟
