# The questions for the linguist, as a multiple-choice form — the source of
# their wording, loaded into the store by tools/load_questions.py.
#
# **Why a file, when the store is the record.** The store holds the questions
# and the rulings, and the rulings are the record — that does not change. But
# the *wording* of a question is ours until he answers it, and wording is
# reviewed best as text in git: the project lead proofreads it here, a change
# shows as a diff, and the loader puts the reviewed text into the store. Once a
# question has a ruling the loader leaves it alone (`db.rulings.reword`
# refuses), because after that the wording is what his answer answered.
#
# **What is asked, and why only this.** The blocking questions that were still
# open in the re-check of 2026-10-17, measured against karbon 1.2.0
# (`lexicon-20261012`), plus the three meaning questions the project lead asked
# for on 2026-10-18. Answered there and not asked again: L16, L27, L29, L31,
# L33. L1 is now karbon's (UPSTREAM B4). Every other open question in the app is
# withdrawn by the loader with the reason under `withdraw`, never deleted.
#
# **How the Persian is written** (the project lead, 2026-10-18): complete,
# simple sentences that carry the full meaning — nothing dropped to shorten;
# enough context to see what is at stake for the engine, and no more; the
# linguist's own terms; Behnevis for the examples, as the documents write them;
# every question readable on its own, without "the question above". Options are
# full sentences saying what would follow, mutually exclusive, the one the
# evidence favours first. `suggested: true` («پیشنهاد ما») only where the
# documents state a proposed default. `settles: false` marks «نمی‌دانم»: it is
# recorded, and the question keeps waiting. A free-text box is always offered
# beside the options on screen, so none of them needs to say "other".
#
# **Handles.** A question split into parts keeps its number and adds a letter:
# L17, L17b, L17c, L17d. L26 also carries L18 (`covers`), which is the same
# question asked from the compounding side.
#
# Fields per question: reference, blocks_work, covers (optional), question_en
# (our one-line gloss), question_fa, choices (id, text_fa, suggested?,
# settles?). No person is named in this file: the repository is public.

version: 1
written: 2026-10-18
measured_against: lexicon-20261012 (karbon 1.2.0)

questions:
  - reference: L26
    covers: [L18, L26]
    blocks_work: true
    question_en: >-
      Does «نام» in the rule table mean a nām only, or a nām or a kārnām? Four
      nominal rules and the soxanguy slot rules cannot build their own examples.
    question_fa: |
      در جدول‌های قاعده، ۸۰ قاعده پایهٔ خود را «نام» نوشته‌اند و تنها یک قاعده، یعنی N-098 با پسوند ـی، کارنام می‌پذیرد. شش قاعدهٔ ترکیبی هم که واژه‌ای را مستقیم به کاربن دو می‌پیوندند، مانند سخنگو (soxanguy)، جای نخست را «نام» نوشته‌اند.

      پایگاه کربن واژه‌هایی مانند امید، هنر، سخن و کار را «اسم معنی» شمرده است، و در نوشتهٔ شما اسم معنی کارنام است. واژهٔ «دانش» را هم خود موتور از کاربن دوِ دانستن می‌سازد و آن را کارنام می‌نامد. بنابراین موتور هیچ‌یک از این واژه‌ها را به قاعده‌ای که نام می‌خواهد نمی‌دهد.

      نتیجه این است که چند قاعده نمونهٔ خودشان را نمی‌توانند بسازند: دانشمند (dānešmand) با ـمند، امیدوار (omidvār) با ـوار، دانشگاه (Dānešgāh) با ـگاه، دانشور (dānešvar) با ـور، و سخنگو (soxanguy). دست‌کم ۱۴ نمونه از ۱۶۳ نمونهٔ جدول به همین یک علت ساخته نمی‌شوند. این واژه‌ها فارسیِ روزمره‌اند: امیدوار در ۵۳۸ سند از پیکره آمده است، هنرمند در ۲۱۱ و سخنگو در ۱۲۱.

      اگر «نام» در این جدول کارنام را هم دربر بگیرد، همهٔ این نمونه‌ها ساخته می‌شوند، و نزدیک به ۱۹۵۰ واژه‌ای که امروز کارنام‌اند، به‌جای یک واژه به‌طور میانه نزدیک به ۶۵ واژه در یک گام می‌سازند. بهای آن این است که پیوندهای نادرست هم بیشتر می‌شوند: «بوستان» درست ساخته می‌شود (بو + ستان)، ولی پیوندهایی هم پیدا می‌شوند که تنها کنار هم نشستن چند حرف‌اند، مانند خواندن «داستان» به‌صورت دا + ستان.

      پرسش: «نام» در جدول قاعده‌ها، چه در قاعده‌های پسوندی و چه در قاعده‌های ترکیبی مانند سخنگو، تنها نام را می‌خواهد یا کارنام را هم دربر می‌گیرد؟
    choices:
      - id: nam_or_karnam
        text_fa: >-
          «نام» در این جدول هم نام را دربر می‌گیرد و هم کارنام را؛ پس هر قاعده‌ای که نام می‌پذیرد کارنام را هم بپذیرد، و دانشمند، امیدوار، دانشگاه، دانشور و سخنگو ساخته شوند.
      - id: some_rules
        text_fa: >-
          تنها برخی از قاعده‌ها کارنام را هم می‌پذیرند؛ آن قاعده‌ها را در جعبهٔ متن می‌نویسم، و قاعده‌های دیگر تنها نام بپذیرند.
      - id: karbon_class
        text_fa: >-
          «نام» در این جدول تنها نام است، ولی امید، هنر، سخن، دانش و واژه‌های مانند آن‌ها نام‌اند و نه کارنام؛ پس ردهٔ این واژه‌ها در کربن باید درست شود و قاعده‌ها دست نخورند.
      - id: nam_only
        text_fa: >-
          «نام» در این جدول تنها نام است و کارنام را دربر نمی‌گیرد؛ این نمونه‌ها از راه دیگری ساخته می‌شوند که آن را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L28
    blocks_work: true
    question_en: >-
      Is nām + nām with nothing between them (کتابخانه) a rule? Row 104 is the
      only two-noun row and it inserts ā, so the engine builds کتاباخانه.
    question_fa: |
      بسیاری از واژه‌های فارسی از کنار هم نشستن دو نام ساخته شده‌اند: کتابخانه، گلاب، روزنامه و شبنم. واژه‌های دستوری خود شما هم همین ساخت را دارند: کارنام، کارواژه، جانام و چون‌واژه.

      در جدول قاعده‌های نام تنها یک ردیف هست که دو نام را به هم می‌پیوندد، ردیف ۱۰۴، و آن ردیف میان دو نام یک «ā» می‌گذارد: Nām + ā + Nām، با نمونه‌های Sarāsar و Sarāpā. چون ردیف دیگری نیست، موتور از کتاب و خانه «کتاباخانه» می‌سازد، از روز و نامه «روزانامه»، و از کار و نام «کارانام».

      پیوند دو نام بی هیچ واکه‌ای میانشان در جدول نیامده است، و ما قاعده‌ای را که در جدول نیست از خودمان نمی‌سازیم. جدا از این، کار و نام و واژه در کربن کارنام شمرده می‌شوند و قاعده‌های نام کارنام نمی‌پذیرند؛ آن را در پرسشی جداگانه پرسیده‌ایم.

      پرسش: آیا پیوستن دو نام بی هیچ واکه‌ای میان آن‌ها، مانند کتاب + خانه = کتابخانه (Ketābxāne)، یکی از قاعده‌های واژه‌سازی است؟
    choices:
      - id: new_row
        text_fa: >-
          آری؛ این ساخت قاعده‌ای جداگانه است که در جدول نوشته نشده، و باید به‌صورت ردیفی تازه (نام + نام = نام) به جدول افزوده شود.
      - id: row104_optional
        text_fa: >-
          ردیف ۱۰۴ هر دو ساخت را دربر می‌گیرد و «ā» در آن اختیاری است: Sarāsar با ā ساخته می‌شود و کتابخانه بی ā.
      - id: not_word_formation
        text_fa: >-
          نه؛ پیوستن دو نام ترکیب است و در این جدول واژه‌سازی جایی ندارد، پس موتور نباید آن را بسازد.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L13
    blocks_work: true
    question_en: >-
      Fifteen rule examples are spelled one way in the grammar and another in
      what we build from karbon's reading (the five -āh/-uh ones are left out).
      Which spelling is right?
    question_fa: |
      هر قاعده در جدول شما نمونه‌ای دارد. ما هر نمونه را دوباره با موتور ساختیم تا ببینیم قاعده نمونهٔ خودش را بازمی‌سازد یا نه. در ۲۰ نمونه موتور همان واژه را می‌سازد، ولی با املایی دیگر، چون واژهٔ پایه را از پایگاه کربن می‌گیرد و کربن آن را با واکهٔ دیگری نوشته است.

      پنج تا از این بیست نمونه به پایانهٔ «اه» و «وه» برمی‌گردند: šāhvār، Māhvāre، Pādšāh، māhāne و Kuhsār. قاعده‌ای که شما برای «اه» و «وه» نوشته‌اید (āh و uh) آن‌ها را روشن کرده است و کربن آن‌ها را درست خواهد کرد، پس آن پنج نمونه را اینجا نمی‌پرسیم.

      پانزده نمونهٔ دیگر می‌ماند. در هر سطر، املای نخست از سند شماست و املای دوم را ما از روی خوانش کربن می‌سازیم. در بیشتر آن‌ها کربن میان دو همخوان واکه‌ای می‌گذارد که سند نمی‌گذارد:
      سند bexrad، ما bexerad
      سند talxvaš، ما talxevaš
      سند Meykade، ما Meyekade
      سند barqāsā، ما baraqāsā
      سند Pahnā، ما Pahinā
      سند nastuh، ما naseteh
      سند divsār، ما dāvesār
      سند divsān، ما dāvesān
      سند Kuče، ما Kueče

      در چند نمونه خودِ واکه فرق دارد یا جای دیگری نشسته است:
      سند dahgān، ما dehgān
      سند Roxsār، ما Ruxsār
      سند Damāvand، ما Demāvand
      سند Drabān، ما Darbān
      سند bigāne، ما bigune
      سند dirine، ما darine

      فایل پیوست فهرست اندازه‌گیری پیشین است و هنوز ۲۱ نمونه دارد.

      پرسش: در این پانزده نمونه کدام املا درست است و باید در برنامه نشان داده شود: املای سند یا املایی که از خوانش کربن به دست می‌آید؟
    choices:
      - id: document
        text_fa: >-
          املای سند درست است: پیوستن پسوند یا پیشوند واکه‌ای نمی‌افزاید، و هر جا خوانش کربن واکهٔ دیگری دارد، آن خوانش باید در کربن درست شود.
      - id: karbon
        text_fa: >-
          خوانش کربن درست است، و نمونه‌های سند باید با آن یکسان شوند.
      - id: per_word
        text_fa: >-
          پاسخ در هر واژه فرق می‌کند؛ در جعبهٔ متن می‌نویسم که در هر نمونه کدام املا درست است.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L25
    blocks_work: true
    question_en: >-
      Does a glide go in where a prefix ending in a vowel meets a base beginning
      with one? The glide table only describes the end of a base.
    question_fa: |
      در فارسی دو واکه کنار هم نمی‌نشینند، و جدول میانجی‌های شما می‌گوید وقتی پسوندی که با واکه آغاز می‌شود به پایه‌ای می‌رسد که به واکه ختم می‌شود، چه میانجی‌ای میانشان می‌آید: ā + ande = Āyande، dānā + i = Dānāyi.

      همهٔ هفده ردیف این جدول دربارهٔ پایانِ پایه است. هیچ ردیفی نمی‌گوید وقتی پیشوندی که به واکه ختم می‌شود به پایه‌ای می‌رسد که با واکه آغاز می‌شود، چه باید کرد. بنابراین موتور امروز این دو را بی هیچ میانجی‌ای کنار هم می‌گذارد: bi + Andiše = biandiše، na + Omid = naomid، be + Andāze = beandāze.

      از ۵۳ قاعدهٔ پیشوندی، ۲۴ قاعده به واکه ختم می‌شوند، و در ۳۰۰ خوانشِ تصادفی از پایگاه کربن، موتور تنها در یک گام ۱۱۹ بار چنین پیوندی می‌سازد. از جفت‌هایی که در پیوند پیشوند پیش می‌آیند، تنها u و e در جدول ردیف دارد (uye). هیچ ردیفی با a در سمت چپ نیست، و برای i و e یا e و e هم ردیفی نیست.

      پرسش: وقتی پیشوندی که به واکه ختم می‌شود به پایه‌ای می‌رسد که با واکه آغاز می‌شود، آیا میانشان میانجی می‌آید؟
    choices:
      - id: no_glide
        text_fa: >-
          میانجی نمی‌آید؛ پیشوند جدا از پایه نوشته می‌شود، مانند ناآگاه و بی‌انصاف، و دو واکه کنار هم می‌مانند، همان‌گونه که موتور امروز می‌سازد.
      - id: same_table
        text_fa: >-
          میانجی می‌آید و همان جدول به کار می‌رود، با پیشوند در سمت چپ؛ میانجیِ جفت‌هایی را که در جدول نیستند (a و e، i و e، e و e) در جعبهٔ متن می‌نویسم.
      - id: other_rule
        text_fa: >-
          میانجی می‌آید، ولی با قاعده‌ای جدا از جدول پسوندها؛ آن قاعده را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L24
    blocks_work: true
    question_en: >-
      دستور — دست + the suffix -var (N-080), or دست + ور, the present stem
      karbon gives وشتن? And should the screen show both readings for the 25
      verbs whose present stem is spelled like a suffix?
    question_fa: |
      صفحهٔ ترکیب برای «دست» واژهٔ «دستور» را دو بار پیشنهاد می‌کند، یک بار به‌صورت کارنده‌کاربهر (V-078) و یک بار به‌صورت کاریده‌کاربهر (V-079). هر دو بار «دستور» را دست + ور می‌خواند و «ور» را کاربن دوِ «وشتن» می‌گیرد، چون پایگاه کربن کاربن دوِ وشتن را «ور» (var) نوشته و آن را قطعی شمرده است.

      ولی در جدول قاعده‌های نام قاعدهٔ N-080 هم هست: نام + ـور = برنام، با نمونهٔ دانشور (dānešvar). با این قاعده همان حرف‌ها به‌صورت دست + پسوند ـور خوانده می‌شوند.

      این تنها دربارهٔ «دستور» نیست. در پایگاه کربن ۲۵ کارواژه هست که کاربن دوِ آن‌ها مانند یک پسوند نوشته می‌شود، و هر واژه‌ای که با این بن‌ها ساخته شود همین دوگانگی را دارد.

      پرسش: «دستور» از «دست» و کدام «ور» ساخته شده است، و صفحه در چنین واژه‌هایی کدام خوانش را نشان دهد؟ اگر می‌دانید که «ور» به‌راستی کاربن دوِ وشتن هست یا نه، لطفاً این را هم در جعبهٔ متن بنویسید.
    choices:
      - id: suffix_only
        text_fa: >-
          «دستور» از دست و پسوند ـور ساخته شده است، و هر جا کاربن دو مانند پسوندی نوشته می‌شود، صفحه تنها خوانش پسوندی را نشان دهد.
      - id: suffix_show_both
        text_fa: >-
          «دستور» از دست و پسوند ـور ساخته شده است، ولی خوانش کاربن دو در واژه‌های دیگر ممکن است؛ پس صفحه هر دو خوانش را کنار هم نشان دهد.
      - id: verb_stem
        text_fa: >-
          «دستور» از دست و کاربن دوِ وشتن ساخته شده است، همان‌گونه که صفحه امروز نشان می‌دهد.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L3
    blocks_work: true
    question_en: >-
      Seven rules state their condition on the base flatly, by its ending.
      Should such a rule build nothing when the ending is wrong?
    question_fa: |
      جدول شما برای بیشتر قاعده‌ها، جز نوع واژهٔ پایه، شرطی هم دربارهٔ خود پایه می‌گوید. برخی از این شرط‌ها نرم نوشته شده‌اند؛ برای نمونه قاعدهٔ V-010 می‌گوید بن «بیشتر» به ت یا د ختم می‌شود. ما امروز به‌خاطر هیچ شرطی واژه‌ای را رد نمی‌کنیم: واژه را می‌سازیم و کنارش می‌نویسیم که شرط برآورده شده است یا نه.

      این شرط‌ها آشکارا چیزی می‌دانند. روی کارواژهٔ «رفتن»، از ۲۷ واژهٔ ساخته‌شده‌ای که شرطی داشتند، آن‌هایی که شرط را داشتند در ۵۵ درصد موارد در پیکره پیدا شدند و آن‌هایی که نداشتند تنها در ۱۲ درصد.

      هفت قاعده شرط خود را قاطع نوشته‌اند و پایه را با پایانه‌اش می‌شناسند:
      ـگی بر کارنده‌کاربهری که به ـنده ختم می‌شود، مانند Ravandegi (V-023)
      ـی بر کارنده‌کاربهری که به ـا ختم می‌شود، مانند Dānāyi (V-025)
      ـی بر کاریده‌کاربهری که به ـا ختم می‌شود، مانند Rahāyi (V-027)
      ـی بر کارنده‌کاربهری که به ـان ختم می‌شود، مانند Ravāni (V-030)
      نام + کارنده‌کاربهری که به ـان ختم می‌شود، مانند Širinoxorān (V-031)
      ـگی بر کاریده‌کاربهری که به ـه ختم می‌شود، مانند Zadegi (V-082)
      ـگی بر نامی که به ـه ختم می‌شود، مانند xānegi و haftegi (N-092)

      پرسش: در این هفت قاعده، وقتی پایانهٔ پایه آن نیست که جدول گفته، آیا قاعده باید کار نکند و هیچ واژه‌ای نسازد؟
    choices:
      - id: stop
        text_fa: >-
          آری؛ در این هفت قاعده، اگر پایانهٔ پایه با شرط جدول نخواند، قاعده هیچ واژه‌ای نسازد.
      - id: build_and_mark
        text_fa: >-
