  - reference: L17c
    blocks_work: true
    question_en: >-
      The vocative has no Persian term. بانگا (built today by N-032),
      بانگ‌نام, or is the class outside the table?
    question_fa: |
      در برنامه، رده‌های دستوری با واژه‌های خود شما نام برده می‌شوند. برای ندایی، سند Nedāyi می‌نویسد، که خودش از واژهٔ عربی «ندا» آمده است. ما جای این واژه را خالی گذاشته‌ایم، و صفحه‌ها «ندایی» را نشان می‌دهند و می‌گویند که واژهٔ شما برای آن در دست نیست.

      پیشنهاد ما «بانگا» (bāngā) است: بانگ + ـا، با همان قاعدهٔ N-032 که در جدول شما ندایی می‌سازد، مانند خوشا و دردا. کربن «بانگ» را با «نداء» معنا کرده است، و موتور «بانگا» را امروز بی هیچ تغییری می‌سازد. ایراد آن این است که این واژه ندایی را نشان می‌دهد ولی تعریف نمی‌کند.

      جایگزینِ ساده‌تر «بانگ‌نام» است. ولی بیشتر واژه‌هایی که به ـنام ختم می‌شوند، مانند خوشنام و گمنام، برنام‌اند، و «بانگ‌نام» را می‌شود «پرآوازه» فهمید.

      پرسش: برای ندایی چه واژه‌ای به کار ببریم؟
