    جدول بازبینی‌شدهٔ ۱۹ نوامبر ۲۰۲۶ «دستور» را در ردیف ۱۰۴ نمونهٔ پسوند ـur (دارندگی) آورده است، کنار rānjur و ganjur؛ پس دستور نه از کنون‌کاربن «ور» ساخته شده است و نه از پسوند ـvar.
  L17c: >-
    جدول بازبینی‌شدهٔ ۱۹ نوامبر ۲۰۲۶ پسوند ـā (ندایی) را در ردیف ۱۰۹ سازندهٔ نام و برنام می‌داند، پس ندایی ردهٔ جداگانه‌ای نیست که نامی بخواهد.
  # Settled by the linguist's own word bank (2026-11-12); listing a blocking
  # question here is the decision to close it.
  L17: >-
    خود شما در بانک واژه گروه ضمیرها را «جانام» نامیده‌اید، و برنامه همین نام را به کار می‌برد.
  L17b: >-
    خود شما در بانک واژه گروه حرف‌های اضافه را «پیش‌واژه» نامیده‌اید، و برنامه همین نام را به کار می‌برد.
  L13: >-
    بانک واژهٔ شما خود املای این نمونه‌ها را نشان می‌دهد: بخرد (bexrad) و نستوه (nastuh) در آن همان‌گونه نوشته شده‌اند که در سند، دربان (darbān) نشان می‌دهد که «Drabān» در سند لغزش قلم است، و هشت نمونهٔ دیگر اکنون درست ساخته می‌شوند؛ آنچه مانده کار برنامه است و نه پرسشی از شما.
  L1: >-
    اختلاف میان پایگاه کربن و جدول بن‌های خودِ کربن است و از راه کربن پیگیری می‌شود؛ تا آن زمان مقدارهای سند به کار می‌روند.
  L5: >-
    پاسخ آن تنها رتبه‌بندی و گزارش‌ها را تغییر می‌دهد و ساختن واژه را متوقف نکرده است.
  L6: >-
    پاسخ آن تنها گزارش‌ها را تغییر می‌دهد و ساختن واژه را متوقف نکرده است.
  L7: >-
    این قاعده ساخته شده و با یک خط برگرداندنی است، و قاعده‌های G-09 و G-10 خود جدول همین را فرض می‌گیرند؛ کار را متوقف نکرده است.
  L8: >-
    بخش اصلی آن را سرپرست پروژه در ۱۳ اوت ۲۰۲۶ روشن کرد و آنچه مانده کار را متوقف نمی‌کند.
  L9: >-
    از آن تنها نمونهٔ Došnām مانده است و کار را متوقف نمی‌کند.
  L12: >-
    کارواژهٔ «باشیدن» جداگانه در پایگاه کربن هست و واژه‌هایی مانند «باشنده» از آن راه ساخته می‌شوند؛ دیگر کار را متوقف نمی‌کند.
  L14: >-
    این پنج مورد لغزش رونویسی‌اند و کار را متوقف نمی‌کنند.
  L15: >-
    هر سه تصمیم ساخته شده و هر کدام با یک خط برگرداندنی است؛ کار را متوقف نمی‌کند.

