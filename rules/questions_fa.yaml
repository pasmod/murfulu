        settles: false

  - reference: L26
    covers: [L18, L26, L35]
    blocks_work: true
    question_en: >-
      Does «نام» in the rule table mean a nām only, or a nām or a kārnām? The
      corrected table names Kārnām only where a row takes it alone (row 19),
      yet ten rows that say Nām are illustrated with words built on a kārnām
      (dānešmand, omidvār, Hušyār), which the engine therefore cannot build.
    question_fa: |
      جدول بازبینی‌شدهٔ ۱۹ نوامبر ۲۰۲۶ در ۱۰۲ قاعده پایه را «نام» می‌نویسد و تنها در دو ردیف کارنام را نام می‌برد: ردیف ۱۹، be- بر کارنام با نمونه‌های bexubi و bezudi، و ردیف ۱۲۶، ـgar، که کارنام را کنار برنام و کاربن‌ها می‌پذیرد. از این برمی‌آید که «نام» در جدول تنها نام است.

      ولی در بانک واژهٔ شما ۱۰٬۶۴۵ واژه تنها کارنام‌اند و نام نیستند، و نمونه‌های خود ده ردیفی که پایه را «نام» نوشته‌اند بر همین واژه‌ها ساخته شده‌اند: bāhonar (ردیف ۱، هنر)، nākām (ردیف ۱۱، کام)، Emšab (ردیف ۵۷، شب)، Pišāhang (ردیف ۶۳، آهنگ)، dānešmand (ردیف ۸۵، دانش)، ranjur (ردیف ۹۴، رنج)، dānešvar (ردیف ۹۵)، omidvār (ردیف ۹۶، امید)، Dānešgāh (ردیف ۱۸۰) و Hušyār (ردیف ۲۰۵، هوش). موتور امروز هیچ‌یک از این نمونه‌ها را نمی‌سازد، و واژه‌هایی مانند هوشمند، بیهوش، باهوش و هوشواره هم ساخته نمی‌شوند.

      اگر «نام» در همهٔ جدول کارنام را هم دربر بگیرد، همهٔ این واژه‌ها ساخته می‌شوند، ولی شمار واژه‌هایی که برنامه می‌سازد نزدیک به سیزده برابر می‌شود، از نزدیک به ۳٫۹ میلیون به ۵۱ میلیون، و پیوندهای نادرست هم بیشتر می‌شوند. اگر تنها همین ده ردیف کارنام را بپذیرند، نمونه‌های خود جدول ساخته می‌شوند و شمار واژه‌ها نزدیک به دو و نیم برابر می‌شود.

      پرسش: «نام» در جدول قاعده‌ها، چه در قاعده‌های پسوندی و پیشوندی و چه در قاعده‌های ترکیبی، تنها نام را می‌خواهد یا کارنام را هم دربر می‌گیرد؟

      پیشنهاد ما: گزینهٔ دوم، چون جدول تازه هر جا تنها کارنام را خواسته آن را نوشته است، ولی نمونه‌های همین ده ردیف بر کارنام ساخته شده‌اند، و پذیرفتن کارنام در این ده ردیف نمونه‌های شما را می‌سازد و شمار واژه‌ها را به‌جای سیزده برابر تنها دو و نیم برابر می‌کند.
    choices:
      - id: nam_or_karnam
        text_fa: >-
          «نام» در این جدول هم نام را دربر می‌گیرد و هم کارنام را؛ پس هر قاعده‌ای که نام می‌پذیرد کارنام را هم بپذیرد.
      - id: some_rules
        suggested: true
        text_fa: >-
          تنها ردیف‌هایی که نمونه‌شان بر کارنام ساخته شده است کارنام را هم بپذیرند، یعنی ردیف‌های ۱، ۱۱، ۵۷، ۶۳، ۸۵، ۹۴، ۹۵، ۹۶، ۱۸۰ و ۲۰۵؛ اگر ردیف دیگری هم باید کارنام بپذیرد، آن را در جعبهٔ متن می‌نویسم.
      - id: karbon_class
        text_fa: >-
          «نام» در این جدول تنها نام است، ولی هنر، دانش، امید، هوش و واژه‌های مانند آن‌ها نام هم هستند؛ پس گروه این واژه‌ها در بانک واژه باید درست شود و قاعده‌ها دست نخورند.
      - id: nam_only
        text_fa: >-
          «نام» در این جدول تنها نام است و کارنام را دربر نمی‌گیرد؛ این نمونه‌ها از راه دیگری ساخته می‌شوند که آن را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

