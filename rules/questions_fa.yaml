# The questions for the linguist, as a multiple-choice form — the source of
# their wording, loaded into the store by tools/load_questions.py.
#
# **Why a file, when the store is the record.** The store holds the questions
# and the rulings, and the rulings are the record — that does not change. But
# the *wording* of a question is ours until he answers it, and wording is
# reviewed best as text in git: the project lead proofreads it here, a change
# shows as a diff, and the loader puts the reviewed text into the store. Once a
# question has a ruling the loader leaves it alone (`db.rulings.reword`
# refuses), because after that the wording is what his answer answered.
#
# **What is asked, and why only this** (rework of 2026-11-12, after karbon
# 1.3.2 — `lexicon-20261111`, the linguist's final word bank). Only questions
# that block work. Settled by his own documents and not asked again: L17 and
# L17b (his group names), L13 (his bank spells the examples itself). L26, with
# L18 and L35 under it, waits for his corrected rules and is **deferred**: not
# shown as waiting, reworded here so it is ready. A question whose answer we
# are certain of is not asked; it is recorded as a decision in
# docs/DECISIONS.md instead. Answered earlier and not asked again: L16, L27,
# L29, L31, L33. L1 is karbon's (UPSTREAM B4).
#
# **One question does not block work: L36** (2026-11-13), the three levels the
# build screen gives a word. They are built and marked unconfirmed under the
# working rule, and the project lead asked for the question to be put to him;
# it carries `blocks_work: false`.
#
# **How the Persian is written** (the project lead, 2026-10-18 and 2026-11-12):
# complete, simple sentences that carry the full meaning — nothing dropped to
# shorten; enough context to see what is at stake for the engine, and no more;
# the linguist's own terms, with his names since the word bank (پیشین‌کاربن،
# کنون‌کاربن); Behnevis for the examples, as the documents write them; every
# question readable on its own, without "the question above". Options are full
# sentences saying what would follow, mutually exclusive. **Every question ends
# with our proposal**: after the question, a paragraph «پیشنهاد ما: …» naming
# the option we think right and why, in one sentence; that option carries `suggested: true`
# («پیشنهاد ما» on screen). A deferred question carries no proposal until it
# is asked. `settles: false` marks «نمی‌دانم»: it is recorded,
# and the question keeps waiting. A free-text box is always offered beside the
# options on screen, so none of them needs to say "other".
#
# **Handles.** A question split into parts keeps its number and adds a letter:
# L17, L17b, L17c, L17d. L26 also carries L18 (`covers`), which is the same
# question asked from the compounding side.
#
# Fields per question: reference, blocks_work, covers (optional), defer
# (optional: the Persian reason it is not asked now — the loader rewords it and
# sets it aside), question_en (our one-line gloss), question_fa, choices (id,
# text_fa, suggested?, settles?). No person is named in this file: the
# repository is public.

version: 2
written: 2026-11-12
measured_against: lexicon-20261111 (karbon 1.3.2)

questions:
  - reference: L17d
    blocks_work: true
    question_en: >-
      The word bank has the linguist's twelve groups; the rule tables use the
      grammar's twelve classes. Is our connection between them right — above
      all, does کاربهر feed the doer participle only?
    question_fa: |
      بانک واژهٔ شما دوازده گروه دارد، و جدول‌های قاعده دوازده ردهٔ دستوری. برنامه اکنون هر واژه را با گروه‌های شما می‌شناسد و نام‌های شما را نشان می‌دهد، از جمله پیشین‌کاربن و کنون‌کاربن به جای کاربن یک و کاربن دو. برای اینکه قاعده‌ها بدانند کدام واژه را بپذیرند، هر گروه را این‌گونه به یک ردهٔ قاعده پیوند داده‌ایم:
      نابسودکارواژه، نام، کارنام، برنام، چون‌واژه، پیش‌واژه و جانام: هر کدام همان ردهٔ هم‌نام در جدول قاعده‌ها.
      کاربهر: کارنده‌کاربهر. دهخدا بیشتر این ۱۱۰۶ واژه را «نعت فاعلی» نامیده است، ۴۴۸ تا از آن‌ها به «نده» ختم می‌شوند، و کاریده‌کاربهرهای کامل، مانند «گفته»، در گروه برنام شما آمده‌اند. ولی دهخدا نزدیک به سی واژه از این گروه را «نعت مفعولی مرخم» می‌نامد، یعنی کاریده‌کاربهر کوتاه‌شده، مانند پسند (پسندیده)، دمید (دمیده) و آژن، و چند واژه را هر دو، مانند رس و افشان. تا پاسخ شما، برنامه همهٔ این گروه را کارنده‌کاربهر می‌گیرد.
      پسوند، پیوند‌واژه و صوت: به هیچ قاعده‌ای داده نمی‌شوند، چون هیچ قاعده‌ای در جدول آن‌ها را نمی‌پذیرد، و پسوند خودش چیزی است که قاعده می‌افزاید، نه واژه‌ای که قاعده از آن آغاز کند.
      وام‌واژه: همان‌گونه که خواسته‌اید، در واژه‌سازی به کار نمی‌رود، ولی در بانک واژه دیده و جست‌وجو می‌شود.

      این پیوندها کار برنامه را تعیین می‌کنند: چهار قاعده کارنده‌کاربهر می‌پذیرند و دو قاعده، V-027 و V-082، کاریده‌کاربهر. توضیح یک‌خطی‌ای که برنامه برای هر رده نشان می‌دهد در صفحهٔ بانک واژه دیده می‌شود؛ اگر یکی از آن‌ها نادرست است، آن را هم در جعبهٔ متن بنویسید.

      پرسش: آیا این پیوند میان گروه‌های بانک واژه و رده‌های جدول قاعده‌ها درست است، و واژه‌های گروه کاربهر را چگونه میان کارنده و کاریده بخش کنیم؟

      پیشنهاد ما: گزینهٔ دوم، چون نشانهٔ خود دهخدا، «نف» یا «ن مف»، برای هر واژه می‌گوید کدام کاربهر است، و بیشتر گروه کارنده‌کاربهر است.
    choices:
      - id: right
        text_fa: >-
          پیوندها درست‌اند، و همهٔ گروه کاربهر کارنده‌کاربهر است، همان‌گونه که برنامه امروز می‌گیرد.
      - id: by_dehkhoda
        suggested: true
        text_fa: >-
          پیوندها درست‌اند، ولی واژه‌هایی که دهخدا «ن مف» نامیده است کاریده‌کاربهرند و بقیه کارنده‌کاربهر؛ واژه‌ای که هر دو نشانه را دارد هر دو را می‌گیرد.
      - id: karbahr_both
        text_fa: >-
          گروه کاربهر را باید به راه دیگری بخش کرد؛ در جعبهٔ متن می‌نویسم چگونه.
      - id: other_fix
        text_fa: >-
          پیوند گروه دیگری باید تغییر کند؛ آن را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L24
    blocks_work: true
    question_en: >-
      «ور» is confirmed as the present stem of وشتن. Is دستور built on that stem
      or on the suffix -var (N-080), and which reading should the screen show?
    question_fa: |
      شما روشن کرده‌اید که «ور» (var) کنون‌کاربنِ «وشتن» است. از این رو صفحهٔ ترکیب «دستور» را دست + ور می‌خواند و ور را کنون‌کاربن وشتن می‌گیرد، یک بار به‌صورت کارنده‌کاربهر (V-078) و یک بار به‌صورت کاریده‌کاربهر (V-079).

      ولی در جدول قاعده‌های نام قاعدهٔ N-080 هم هست: نام + ـور = برنام، با نمونهٔ دانشور (dānešvar). با این قاعده همان حرف‌ها به‌صورت دست + پسوند ـور خوانده می‌شوند، مانند تاجور و دانشور.

      این تنها دربارهٔ «دستور» نیست. کنون‌کاربن ۱۴ کارواژهٔ دیگر هم مانند یک پسوند نوشته می‌شود، برای نمونه «دان» از دانستن و «بار» از باریدن، و هر واژه‌ای که با این بن‌ها ساخته شود همین دوگانگی را دارد.

      پرسش: «دستور» از «دست» و کدام «ور» ساخته شده است، و صفحه در چنین واژه‌هایی کدام خوانش را نشان دهد؟

      پیشنهاد ما: گزینهٔ دوم، چون «دستور» مانند «دانشور» و «تاجور» با پسوند ـور ساخته شده است، ولی خوانش کنون‌کاربن در واژه‌های دیگر ممکن است و پنهان کردن آن داوری را از خواننده می‌گیرد.
    choices:
      - id: suffix_only
        text_fa: >-
          «دستور» از دست و پسوند ـور ساخته شده است، و هر جا کنون‌کاربن مانند پسوندی نوشته می‌شود، صفحه تنها خوانش پسوندی را نشان دهد.
      - id: suffix_show_both
        suggested: true
        text_fa: >-
          «دستور» از دست و پسوند ـور ساخته شده است، ولی خوانش کنون‌کاربن در واژه‌های دیگر ممکن است؛ پس صفحه هر دو خوانش را کنار هم نشان دهد و خوانش پسوندی را نخست بیاورد.
      - id: verb_stem
        text_fa: >-
          «دستور» از دست و کنون‌کاربنِ وشتن ساخته شده است، همان‌گونه که صفحه امروز نشان می‌دهد.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L28
    blocks_work: true
    question_en: >-
      Is nām + nām with nothing between them (کتابخانه) a rule? Row 104 is the
      only two-noun row and it inserts ā, so the engine builds کتاباخانه.
    question_fa: |
      بسیاری از واژه‌های فارسی از کنار هم نشستن دو نام ساخته شده‌اند: کتابخانه، گلاب، روزنامه و شبنم. واژه‌های دستوری خود شما هم همین ساخت را دارند: کارنام، کارواژه، جانام و چون‌واژه.

      در جدول قاعده‌های نام تنها یک ردیف هست که دو نام را به هم می‌پیوندد، ردیف ۱۰۴، و آن ردیف میان دو نام یک «ā» می‌گذارد: Nām + ā + Nām، با نمونه‌های Sarāsar و Sarāpā. چون ردیف دیگری نیست، موتور از کتاب و خانه «کتاباخانه» می‌سازد، از روز و نامه «روزانامه»، و از کار و نام «کارانام».

      پیوند دو نام بی هیچ واکه‌ای میانشان در جدول نیامده است، و ما قاعده‌ای را که در جدول نیست از خودمان نمی‌سازیم. جدا از این، کار و نام و واژه در کربن کارنام شمرده می‌شوند و قاعده‌های نام کارنام نمی‌پذیرند؛ آن را در پرسشی جداگانه پرسیده‌ایم.

      پرسش: آیا پیوستن دو نام بی هیچ واکه‌ای میان آن‌ها، مانند کتاب + خانه = کتابخانه (Ketābxāne)، یکی از قاعده‌های واژه‌سازی است؟

      پیشنهاد ما: گزینهٔ نخست، چون کتابخانه، گلاب و روزنامه، و واژه‌های دستوری خود شما مانند کارنام و چون‌واژه، بی هیچ واکه‌ای میان دو نام ساخته شده‌اند و ردیف ۱۰۴ با «ā»ی خود آن‌ها را نمی‌سازد.
    choices:
      - id: new_row
        suggested: true
        text_fa: >-
          آری؛ این ساخت قاعده‌ای جداگانه است که در جدول نوشته نشده، و باید به‌صورت ردیفی تازه (نام + نام = نام) به جدول افزوده شود.
      - id: row104_optional
        text_fa: >-
          ردیف ۱۰۴ هر دو ساخت را دربر می‌گیرد و «ā» در آن اختیاری است: Sarāsar با ā ساخته می‌شود و کتابخانه بی ā.
      - id: not_word_formation
        text_fa: >-
          نه؛ پیوستن دو نام ترکیب است و در این جدول واژه‌سازی جایی ندارد، پس موتور نباید آن را بسازد.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L3
    blocks_work: true
    question_en: >-
      Seven rules state their condition on the base flatly, by its ending.
      Should such a rule build nothing when the ending is wrong?
    question_fa: |
      جدول شما برای بیشتر قاعده‌ها، جز نوع واژهٔ پایه، شرطی هم دربارهٔ خود پایه می‌گوید. برخی از این شرط‌ها نرم نوشته شده‌اند؛ برای نمونه قاعدهٔ V-010 می‌گوید بن «بیشتر» به ت یا د ختم می‌شود. ما امروز به‌خاطر هیچ شرطی واژه‌ای را رد نمی‌کنیم: واژه را می‌سازیم و کنارش می‌نویسیم که شرط برآورده شده است یا نه.

      این شرط‌ها آشکارا چیزی می‌دانند. روی کارواژهٔ «رفتن»، از ۲۷ واژهٔ ساخته‌شده‌ای که شرطی داشتند، آن‌هایی که شرط را داشتند در ۵۵ درصد موارد در پیکره پیدا شدند و آن‌هایی که نداشتند تنها در ۱۲ درصد.

      هفت قاعده شرط خود را قاطع نوشته‌اند و پایه را با پایانه‌اش می‌شناسند:
      ـگی بر کارنده‌کاربهری که به ـنده ختم می‌شود، مانند Ravandegi (V-023)
      ـی بر کارنده‌کاربهری که به ـا ختم می‌شود، مانند Dānāyi (V-025)
      ـی بر کاریده‌کاربهری که به ـا ختم می‌شود، مانند Rahāyi (V-027)
      ـی بر کارنده‌کاربهری که به ـان ختم می‌شود، مانند Ravāni (V-030)
      نام + کارنده‌کاربهری که به ـان ختم می‌شود، مانند Širinoxorān (V-031)
      ـگی بر کاریده‌کاربهری که به ـه ختم می‌شود، مانند Zadegi (V-082)
      ـگی بر نامی که به ـه ختم می‌شود، مانند xānegi و haftegi (N-092)

      پرسش: در این هفت قاعده، وقتی پایانهٔ پایه آن نیست که جدول گفته، آیا قاعده باید کار نکند و هیچ واژه‌ای نسازد؟

      پیشنهاد ما: گزینهٔ نخست، چون این هفت شرط پایانهٔ پایه را می‌گویند و برای هر پایانه قاعدهٔ جداگانه‌ای هست (Ravandegi با ـگی، Dānāyi با ـی)، پس ساختن بر پایانهٔ دیگر تنها ریختی نادرست کنار ریخت درست می‌سازد.
    choices:
      - id: stop
        suggested: true
        text_fa: >-
          آری؛ در این هفت قاعده، اگر پایانهٔ پایه با شرط جدول نخواند، قاعده هیچ واژه‌ای نسازد.
      - id: build_and_mark
        text_fa: >-
          نه؛ واژه ساخته شود و، همان‌گونه که امروز هست، کنارش نوشته شود که شرط برآورده نشده است.
      - id: some_rules
        text_fa: >-
          برای برخی از این هفت قاعده آری و برای برخی نه؛ در جعبهٔ متن می‌نویسم کدام.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L25
    blocks_work: true
    question_en: >-
      Does a glide go in where a prefix ending in a vowel meets a base beginning
      with one? The glide table only describes the end of a base.
    question_fa: |
      در فارسی دو واکه کنار هم نمی‌نشینند، و جدول میانجی‌های شما می‌گوید وقتی پسوندی که با واکه آغاز می‌شود به پایه‌ای می‌رسد که به واکه ختم می‌شود، چه میانجی‌ای میانشان می‌آید: ā + ande = Āyande، dānā + i = Dānāyi.

      همهٔ هفده ردیف این جدول دربارهٔ پایانِ پایه است. هیچ ردیفی نمی‌گوید وقتی پیشوندی که به واکه ختم می‌شود به پایه‌ای می‌رسد که با واکه آغاز می‌شود، چه باید کرد. بنابراین موتور امروز این دو را بی هیچ میانجی‌ای کنار هم می‌گذارد: bi + Andiše = biandiše، na + Omid = naomid، be + Andāze = beandāze.

      از ۵۳ قاعدهٔ پیشوندی، ۲۴ قاعده به واکه ختم می‌شوند، و در ۳۰۰ خوانشِ تصادفی از پایگاه کربن، موتور تنها در یک گام ۱۱۹ بار چنین پیوندی می‌سازد. از جفت‌هایی که در پیوند پیشوند پیش می‌آیند، تنها u و e در جدول ردیف دارد (uye). هیچ ردیفی با a در سمت چپ نیست، و برای i و e یا e و e هم ردیفی نیست.

      پرسش: وقتی پیشوندی که به واکه ختم می‌شود به پایه‌ای می‌رسد که با واکه آغاز می‌شود، آیا میانشان میانجی می‌آید؟

      پیشنهاد ما: گزینهٔ نخست، چون پیشوند در نوشتن از پایه جدا می‌ماند، مانند ناآگاه و بی‌انصاف، و جدول میانجی‌های شما تنها پایان پایه را می‌گوید.
    choices:
      - id: no_glide
        suggested: true
        text_fa: >-
          میانجی نمی‌آید؛ پیشوند جدا از پایه نوشته می‌شود، مانند ناآگاه و بی‌انصاف، و دو واکه کنار هم می‌مانند، همان‌گونه که موتور امروز می‌سازد.
      - id: same_table
        text_fa: >-
          میانجی می‌آید و همان جدول به کار می‌رود، با پیشوند در سمت چپ؛ میانجیِ جفت‌هایی را که در جدول نیستند (a و e، i و e، e و e) در جعبهٔ متن می‌نویسم.
      - id: other_rule
        text_fa: >-
          میانجی می‌آید، ولی با قاعده‌ای جدا از جدول پسوندها؛ آن قاعده را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L2
    blocks_work: true
    question_en: >-
      V-002 is for stems "of group 2", but its own example pazāndan rests on
      paz, which karbon puts in group 3 (پختن) or group 1 (پزیدن). Which group
      is meant?
    question_fa: |
      جدول کارواژه‌های شما دو قاعده دارد که با «ـاندن» از کنون‌کاربن نابِسودکارواژهٔ تازه می‌سازند. قاعدهٔ V-001 پایه را «کنون‌کاربنِ ناگذرا از گروه یک» می‌خواند، با نمونه‌های oftāndan و parāndan، و قاعدهٔ V-002 «کنون‌کاربنِ ناگذرا از گروه دو»، با نمونه‌های pazāndan و pazānidan.

      شما در نوشتهٔ واج‌نویسی V.7 هر نابِسودکارواژه را بر پایهٔ دستوری که کنون‌کاربنِ آن را می‌سازد در سه گروه جای داده‌اید، و پایگاه کربن همین گروه را برای هر کارواژه نگه می‌دارد. نمونه‌های V-001 با این تقسیم می‌خوانند: افتادن و پریدن هر دو در گروه یک‌اند.

      ولی نمونهٔ V-002، یعنی pazāndan، از «پز» ساخته شده است، و «پز» در کربن یا کنون‌کاربنِ «پختن» است که در گروه سه جای دارد (دستور ۳۹)، یا کنون‌کاربنِ «پزیدن» که در گروه یک است (دستور ۶). گروه دو در کربن تنها ده کارواژه دارد، مانند زدن، چیدن، بستن و گشتن، و پختن در میان آن‌ها نیست.

      پرسش: «گروه دو» در قاعدهٔ V-002 کدام گروه است؟

      پیشنهاد ما: گزینهٔ نخست، چون نمونه‌های V-001 درست با گروه یک واج‌نویسی V.7 می‌خوانند و در بانک واژه «پز» در هیچ کارواژه‌ای در گروه دو نیست.
    choices:
      - id: v7_groups
        suggested: true
        text_fa: >-
          گروه یک و گروه دو در جدول واژه‌سازی همان گروه‌های یک و دوِ واج‌نویسی V.7 هستند؛ pazāndan نمونهٔ درستی برای V-002 نیست و باید نمونهٔ دیگری جای آن بنشیند.
      - id: other_division
        text_fa: >-
          گروه یک و گروه دو در جدول واژه‌سازی تقسیم دیگری است و با گروه‌های V.7 یکی نیست؛ آن تقسیم را در جعبهٔ متن می‌نویسم.
      - id: paz_in_group2
        text_fa: >-
          گروه‌ها همان گروه‌های V.7 هستند، ولی «پز» باید در گروه دو باشد و کربن آن را در گروه نادرستی گذاشته است.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L17c
    blocks_work: true
    question_en: >-
      The vocative has no Persian term. بانگا (built today by N-032),
      بانگ‌نام, or is the class outside the table?
    question_fa: |
      در برنامه، رده‌های دستوری با واژه‌های خود شما نام برده می‌شوند. برای ندایی، سند Nedāyi می‌نویسد، که خودش از واژهٔ عربی «ندا» آمده است. ما جای این واژه را خالی گذاشته‌ایم، و صفحه‌ها «ندایی» را نشان می‌دهند و می‌گویند که واژهٔ شما برای آن در دست نیست.

      یک راه «بانگا» (bāngā) است: بانگ + ـا، با همان قاعدهٔ N-032 که در جدول شما ندایی می‌سازد، مانند خوشا و دردا. کربن «بانگ» را با «نداء» معنا کرده است، و موتور «بانگا» را امروز بی هیچ تغییری می‌سازد. ایراد آن این است که این واژه ندایی را نشان می‌دهد ولی تعریف نمی‌کند.

      در بانک واژهٔ شما گروهی به نام «صوت» هست، ولی ندایی گروه واژه نیست: ریختی است که قاعده‌ها می‌سازند، مانند «خوشا» با N-032. پس نام آن را از گروه صوت نمی‌توان گرفت.

      جایگزینِ ساده‌تر «بانگ‌نام» است. ولی بیشتر واژه‌هایی که به ـنام ختم می‌شوند، مانند خوشنام و گمنام، برنام‌اند، و «بانگ‌نام» را می‌شود «پرآوازه» فهمید.

      پرسش: برای ندایی چه واژه‌ای به کار ببریم؟

      پیشنهاد ما: گزینهٔ نخست، چون «بانگا» با قاعدهٔ خود شما ساخته می‌شود، معنای «بانگ» را دارد و ریخت ندایی را آشکارا نشان می‌دهد.
    choices:
      - id: banga
        suggested: true
        text_fa: >-
          واژهٔ «بانگا» برای ندایی به کار رود.
      - id: bangnam
        text_fa: >-
          واژهٔ «بانگ‌نام» برای ندایی به کار رود.
      - id: outside_table
        text_fa: >-
          ندایی بیرون از جدول واژه‌های دستوری است؛ همان «ندایی» بماند و صفحه بگوید که واژه‌ای برای آن ساخته نشده است.
      - id: other_term
        text_fa: >-
          واژهٔ دیگری درست است و آن را در جعبهٔ متن می‌نویسم.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L10
    blocks_work: true
    question_en: >-
      May the meaning template hang on each rule instead of on the shared
      semantic tag? Under `Jā`, نمکدان، گلستان، میکده and دانشگاه get one
      sentence.
    question_fa: |
      می‌خواهیم کنار هر واژه‌ای که موتور می‌سازد، معنای آن را هم در یک جمله بنویسیم. این جمله از یک الگو ساخته می‌شود که واژهٔ پایه در آن می‌نشیند؛ برای نمونه «جایی که نمک در آن است» برای نمکدان.

      امروز این الگو به برچسب معنایی بسته است، و یک برچسب میان چند قاعده مشترک است. برچسب «جا» را پنج پسوند دارند: ـان، ـدان، ـستان، ـکده و ـگاه. پس نمکدان، گلستان، میکده و دانشگاه همه یک جمله می‌گیرند، در حالی که نمکدان ظرف است، گلستان سرزمین است، میکده خانه است و دانشگاه نهاد. قاعدهٔ N-068 با پسوند ـگاه هم‌زمان برچسب «جا» و «زمان» را دارد، پس «سحرگاه» را هم جا می‌خواند.

      شما پیش‌تر گفته‌اید که هر پسوند معنای خود را دارد و برخی پسوندها، مانند ـِش، چند معنا دارند. اگر الگو به هر قاعده بسته شود، نزدیک به ۱۹۳ جمله باید نوشته شود؛ اگر به برچسب بسته بماند، ۴۳ جمله.

      پرسش: آیا جملهٔ الگوی معنا می‌تواند به هر قاعده بسته شود، به‌جای برچسب معنایی‌ای که چند قاعده با هم دارند؟

      پیشنهاد ما: گزینهٔ دوم، چون با ۴۳ جملهٔ کلی همهٔ قاعده‌ها معنا می‌گیرند و تنها قاعده‌هایی که معنای ویژه دارند، مانند ـدان در نمکدان، جملهٔ خود را می‌خواهند.
    choices:
      - id: per_rule
        text_fa: >-
          آری؛ هر قاعده جملهٔ الگوی خود را دارد، و قاعده‌ای که چند معنا دارد می‌تواند بیش از یک جمله داشته باشد.
      - id: tag_with_override
        suggested: true
        text_fa: >-
          هر برچسب یک جملهٔ کلی دارد، و تنها جایی که قاعده‌ای معنای ویژهٔ خود را دارد، جملهٔ آن قاعده جای جملهٔ برچسب را می‌گیرد.
      - id: per_tag
        text_fa: >-
          نه؛ الگو به برچسب معنایی بسته بماند، و قاعده‌هایی که یک برچسب دارند یک جمله را با هم به کار ببرند.
      - id: unsure
        text_fa: نمی‌دانم و باید بیشتر بررسی کنم.
        settles: false

  - reference: L10b
    blocks_work: true
    question_en: >-
      Who writes the ~193 meaning templates: the linguist himself, or drafts
      from us that he approves?
    question_fa: |
      برای اینکه موتور معنای واژه‌های ساخته‌شده را بنویسد، برای هر قاعده جملهٔ الگویی لازم است؛ اگر الگو به هر قاعده بسته شود نزدیک به ۱۹۳ جمله، و اگر به برچسب معنایی بسته بماند ۴۳ جمله. امروز تنها یکی از این جمله‌ها نوشته شده است، «جایی که … در آن است» برای برچسب «جا». ما هیچ جملهٔ فارسی‌ای از خودمان ننوشته‌ایم، چون معنای قاعده‌ها را شما تعیین می‌کنید.

      پرسش: این جمله‌های الگو را چه کسی بنویسد؟

      پیشنهاد ما: گزینهٔ دوم، چون نوشتن پیش‌نویس کار ماست و داوری کار شما، و شما تنها جمله‌هایی را می‌خوانید که پیش‌تر نوشته شده‌اند.
