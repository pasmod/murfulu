# Spellings that are, almost always, a function word — and so are no evidence
# for a dictionary word written with the same letters.
#
# **Why this file exists.** Corpus text has no vowels, so a spelling's count is
# the count of the letters. For که that is 609,699 occurrences, and karbon
# 1.2.0 reads row 28296 «که» as the adjective *keh* ("small") — correctly. The
# link pass then credited the conjunction's whole count to the adjective, and
# every form written که (the noun *Keh*, *Koh* from کهیدن) inherited it as
# attestation (data/compare-v12-v13.md). The letters say nothing about whether
# *keh* was ever written.
#
# **What the list does** (murfulu/corpus/function_words.py,
# murfulu/scoring/attestation.py): any lexicon reading or built form whose
# spelling is listed here gets level `spelling` with `function_word` set and
# **no count credited** — "homograph of a function word, attestation unknown".
# Shown, never dropped: the record stays, the interface says why it carries no
# number, and the raw count of the letters stays on the spelling's own
# word_types document. A form *built on* such an entry (کهتر from *keh*) is
# judged on its own spelling, as before.
#
# **How the list was chosen — conservative on purpose.** An entry must be
#   1. closed-class in Persian grammar: conjunction, preposition or
#      postposition (را), pronoun, demonstrative, or particle; and
#   2. among the `max_rank` most frequent spellings of the corpus — measured,
#      not assumed: `rank` and `count` below are corpus v13 (Ganjoor, 25,497,189
#      tokens; the text is unchanged since v4), and tools/check_function_words.py
#      fails if any entry falls outside; and
#   3. its function-word use must plainly dominate any content homograph. That
#      is a judgement and is written down where it was close.
# Left out, although closed-class or near it: است and the other verb forms (the
# inflection analyser's business, not this list's); یک، دو and numerals (the
# lexicon's *yek* is the same word, not a homograph); خود، خویش (also "self",
# "kin" — content words in this poetry); می (*mey*, wine, is common in it); کان
# (*kān*, a mine); کی (*Kay*, the royal title); زین (*zin*, saddle, is common in
# the epic); بس، پس، باز، چند، دیگر، زیر، سوی، میان (adverbs or nouns as often
# as not); چرا (UPSTREAM B7 asks karbon for it as a headword — then it would be
# the word itself, not a homograph); Arabic فی، لا، الله.
#
# **If karbon ever adds one of these as a headword of the function word itself**
# (B7 suggests چون), the entry must be revisited: the list would then doubt the
# word it names. Nothing in the snapshot does that today.
#
# Recorded in docs/ENGINEERING.md ("Building a corpus version", v14) and
# data/compare-v13-v14.md; the background is UPSTREAM B3 and OPEN_QUESTIONS O.

version: 1.0.0
corpus_version: v13
max_rank: 200

