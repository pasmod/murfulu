  - {latin: "-dān", fa: "دان", kind: suffix}
  - {latin: "-e", fa: "ه", kind: suffix}
  - {latin: "-eš", fa: "ش", kind: suffix}
  - {latin: "-ešt", fa: "شت", kind: suffix}
  - {latin: "-gar", fa: "گر", kind: suffix}
  - {latin: "-gi", fa: "گی", kind: suffix}
  - {latin: "-gin", fa: "گین", kind: suffix}
  - {latin: "-gāh", fa: "گاه", kind: suffix}
  - {latin: "-gān", fa: "گان", kind: suffix}
  - {latin: "-gāne", fa: "گانه", kind: suffix}
  - {latin: "-gāni", fa: "گانی", kind: suffix}
  - {latin: "-gār", fa: "گار", kind: suffix}
  - {latin: "-i", fa: "ی", kind: suffix}
  - {latin: "-idan", fa: "یدن", kind: suffix}
  - {latin: "-in", fa: "ین", kind: suffix}
  - {latin: "-ine", fa: "ینه", kind: suffix}
  - {latin: "-kade", fa: "کده", kind: suffix}
  - {latin: "-kār", fa: "کار", kind: suffix}
  - {latin: "-lāx", fa: "لاخ", kind: suffix}
  - {latin: "-mān", fa: "مان", kind: suffix}
  - {latin: "-nā", fa: "نا", kind: suffix}
  - {latin: "-nāk", fa: "ناک", kind: suffix}
  - {latin: "-sir", fa: "سیر", kind: suffix}
  - {latin: "-stān", fa: "ستان", kind: suffix}
  - {latin: "-sār", fa: "سار", kind: suffix}
  - {latin: "-sān", fa: "سان", kind: suffix}
  - {latin: "-tar", fa: "تر", kind: suffix}
  - {latin: "-tarin", fa: "ترین", kind: suffix}
  - {latin: "-umand", fa: "ومند", kind: suffix}
  - {latin: "-ur", fa: "ور", kind: suffix}
  - {latin: "-vand", fa: "وند", kind: suffix}
  - {latin: "-var", fa: "ور", kind: suffix}
  - {latin: "-vaš", fa: "وش", kind: suffix}
  - {latin: "-vār", fa: "وار", kind: suffix}
  - {latin: "-vāre", fa: "واره", kind: suffix}
  - {latin: "-zār", fa: "زار", kind: suffix}
  - {latin: "-ā", fa: "ا", kind: suffix}
  - {latin: "-āk", fa: "اک", kind: suffix}
  - {latin: "-ān", fa: "ان", kind: suffix}
  - {latin: "-āndan", fa: "اندن", kind: suffix}
  - {latin: "-āne", fa: "انه", kind: suffix}
  - {latin: "-ānidan", fa: "انیدن", kind: suffix}
  - {latin: "-ār", fa: "ار", kind: suffix}
  - {latin: "-āsā", fa: "آسا", kind: suffix}
  - {latin: "-če", fa: "چه", kind: suffix}
  - {latin: "-či", fa: "چی", kind: suffix}

  - latin: "-é"
    fa: "ِ"
    kind: suffix
    note: >-
      The grammatical ezāfe. Written é in Behnevis precisely to keep it apart
      from the adjective-forming e, and it is a diacritic in Persian script.

  - latin: "-í"
    fa: "ی"
    kind: suffix
    note: >-
      The indefinite marker. Written í in Behnevis to keep it apart from the
      other i suffixes; the same letter ی in Persian script.

  - latin: "-mānd"
    corrected_latin: "-mand"
    fa: "مند"
    kind: suffix
    ruled_on: 2026-08-11
    note: >-
      **Settled: a typo in the source.** The document writes -mānd, but its own
      example dānešmand (دانشمند) is -mand, and the neighbouring rows use the
      same family: -umand (tanumand) and -vand (Xodāvand). Built as -mand; the
      source spelling stays visible as the lookup key.

  - latin: "-bāž"
    corrected_latin: "bāž-"
    fa: "باژ"
    kind: prefix
    ruled_on: 2026-08-11
    needs_expert_check: true
    note: >-
      **Half settled.** The source writes it as a suffix, "-bāž", but its own
      example bāžgunidan puts it at the front, so it is a prefix — the dash was
      on the wrong side. That much is settled.
      **Still open: the spelling.** The source says bāž, giving باژ, but the
      form written today is usually واژگون (vāžgun) with a v. Both exist in
      older Persian. Being asked.

