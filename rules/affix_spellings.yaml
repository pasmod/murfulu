# Persian spelling for every affix in the source grammar.
#
# The grammar writes affixes in Latin (Behnevis). Murfulu builds the Persian
# form of a generated word in parallel with the Latin one — there is no Latin →
# Persian converter — so each affix needs its Persian spelling written down.
#
# Fields
#   latin    exactly as the source grammar writes it
#   fa       the Persian spelling
#   kind     suffix · prefix · infix · none · slot
#   note     only where something needs saying
#
# `kind: none` is the zero affix, written ‒ in the source: the rule makes a new
# word without adding anything (Parhiz, Sāxt) or by joining two parts.
# `kind: slot` is not an affix at all — the source writes "Nām-" in the affix
# column for compounding rules, meaning "a noun goes here".
#
# Three entries are flagged for the linguist. Everything else is a standard
# Persian derivational affixes.

version: 0.1.0

affixes:
  # -- suffixes ------------------------------------------------------------
  - {latin: "-ak", fa: "ک", kind: suffix}
  - {latin: "-an", fa: "ن", kind: suffix}
