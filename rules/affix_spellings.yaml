  # Prefixes the corrected rules of 2026-11-19 add or write differently.
  - {latin: "ā-", fa: "آ", kind: prefix, note: "row 24, ākandan آکندن; the August grammar wrote -ā (V-051)"}
  - {latin: "andar-", fa: "اندر", kind: prefix, note: "row 25, Andarresidan; the August grammar wrote -andar (V-052)"}
