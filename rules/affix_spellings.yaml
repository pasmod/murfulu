  - {latin: "vāž-", fa: "واژ", kind: prefix, note: "row 61, Vāžgun"}

  - latin: "bāž-"
    fa: "باژ"
    kind: prefix
    ruled_on: 2026-11-19
    note: >-
      **Settled by the linguist's corrected rules.** Row 31 writes the verb
      prefix bāž- (Bāžgunidan, bāžgune), and row 61 gives the noun prefix vāž-
      (Vāžgun) with «bāž» among its meanings: two prefixes, one spelling each.
      This closes the August doubt about «-bāž» (باژ or واژ) below.

  - latin: "bāz"
    corrected_latin: "bāz-"
    fa: "باز"
    kind: prefix
    ruled_on: 2026-11-19
    note: >-
      Row 29 writes «bāz (Jologiri)» without the dash its three neighbours
      (rows 27, 28, 30) carry. The same prefix.

  - latin: "A-"
    corrected_latin: "a-"
    fa: "ا"
    kind: prefix
    ruled_on: 2026-11-19
    note: >-
      Row 52, «A-(Nāyi)», with Amardād امرداد, Akār, Anuš: the privative a-,
      written capitalised because the cell begins with it. The August grammar
      wrote it as the suffix «-ā (Nāyi)» (N-001); the corrected rules put it
      in front, where its examples always had it.

  - latin: "-kam"
    corrected_latin: "kam-"
    fa: "کم"
    kind: prefix
    ruled_on: 2026-11-19
    note: >-
      Row 8 writes «-kam» in the prefix table, and every example (kampul,
      kamzur, kamkār, kamxān) puts it in front: the dash is on the wrong side,
      as it was for the August «-bāž».

  # -- infixes -------------------------------------------------------------
  - {latin: "-na-", fa: "ن", kind: infix}
  - {latin: "-nā-", fa: "نا", kind: infix}
  - {latin: "-ā-", fa: "ا", kind: infix}

  # -- not affixes ---------------------------------------------------------
  - latin: "‒"
    fa: ""
    kind: none
    note: >-
      No affix. The rule makes a word from the base alone (Parhiz, Sāxt) or by
      joining two parts (Zadoxord).

  - {latin: "Nām-", fa: "", kind: slot, note: "A noun fills this position."}
  - {latin: "Čonvāže-", fa: "", kind: slot, note: "An adverb fills this position."}
