  - {latin: "far-", fa: "فر", kind: prefix}
  - {latin: "farā-", fa: "فرا", kind: prefix}
  - {latin: "farāz-", fa: "فراز", kind: prefix}
  - {latin: "foru-", fa: "فرو", kind: prefix}
  - {latin: "ham-", fa: "هم", kind: prefix}
  - {latin: "na-", fa: "ن", kind: prefix}
  - {latin: "nā-", fa: "نا", kind: prefix}
  - {latin: "piš-", fa: "پیش", kind: prefix}
  - {latin: "por-", fa: "پر", kind: prefix}
  - {latin: "pād-", fa: "پاد", kind: prefix}
  - {latin: "sar-", fa: "سر", kind: prefix}
  - {latin: "var-", fa: "ور", kind: prefix}
  - {latin: "vā-", fa: "وا", kind: prefix}
  - {latin: "zebar-", fa: "زبر", kind: prefix}
  - {latin: "zir-", fa: "زیر", kind: prefix}

  - latin: "pa-"
    fa: "پ"
    kind: prefix
    ruled_on: 2026-08-11
    note: >-
      **Settled: پ is correct.** Source row "pa- (be, pey)", example padid
      (پدید) from did. The prefix appears once in the whole grammar, so it was
      flagged; confirmed as پ.

  # -- infixes -------------------------------------------------------------
  - {latin: "-na-", fa: "ن", kind: infix}
  - {latin: "-nā-", fa: "نا", kind: infix}
  - {latin: "-ā-", fa: "ا", kind: infix}

  # -- not affixes ---------------------------------------------------------
  - latin: "‒"
    fa: ""
    kind: none
    note: >-
      No affix. The rule makes a word from the base alone (Parhiz, Sāxt) or by
      joining two parts (Zadoxord).

  - {latin: "Nām-", fa: "", kind: slot, note: "A noun fills this position."}
  - {latin: "Čonvāže-", fa: "", kind: slot, note: "An adverb fills this position."}
