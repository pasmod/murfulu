  - latin: "-é"
    fa: "ِ"
    kind: suffix
    note: >-
      The grammatical ezāfe. Written é in Behnevis precisely to keep it apart
      from the adjective-forming e, and it is a diacritic in Persian script.

  - latin: "-í"
    fa: "ی"
    kind: suffix
    note: >-
      The indefinite marker. Written í in Behnevis to keep it apart from the
      other i suffixes; the same letter ی in Persian script.

  - latin: "-mānd"
    corrected_latin: "-mand"
    fa: "مند"
    kind: suffix
    ruled_on: 2026-08-11
    note: >-
      **Settled: a typo in the source.** The document writes -mānd, but its own
      example dānešmand (دانشمند) is -mand, and the neighbouring rows use the
      same family: -umand (tanumand) and -vand (Xodāvand). Built as -mand; the
      source spelling stays visible as the lookup key.

  - latin: "-bāž"
    corrected_latin: "bāž-"
    fa: "باژ"
    kind: prefix
    ruled_on: 2026-08-11
    note: >-
      **Settled.** The August grammar writes it as a suffix, "-bāž", but its
      own example bāžgunidan puts it at the front, so it is a prefix — the dash
      was on the wrong side. The spelling was the open half: باژ, or واژ as
      in واژگون? The corrected rules of 2026-11-19 answer it — the verb prefix
      is bāž- (row 31) and the noun prefix vāž- (row 61). Kept as the August
      lookup key; the pack builds from "bāž-" above.

