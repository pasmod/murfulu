# Serving the built app.
#
# Two things this file exists for. A single-page app has no file at /rules, so
# an unknown path falls back to index.html and the router decides. And the app
# calls /api on its own origin, so the API is proxied here rather than named in
# the JavaScript — the address of the API is deployment, not code. And how
# long a browser may keep what it is sent: the hashed assets for a year,
# index.html not without asking (tools/check_web_cache.sh checks both).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed file names, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The page that names the bundle, asked again on every visit. Without a
    # Cache-Control a browser may keep it by its own guess, and a page kept
    # after a deploy goes on loading the old bundle. `no-cache` still lets
    # it answer 304 when nothing changed. Every way to the page ends here:
    # `/` through `index`, an app path through the fallback below.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
