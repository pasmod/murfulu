# Serving the built app.
#
# Two things this file exists for. A single-page app has no file at /rules, so
# an unknown path falls back to index.html and the router decides. And the app
# calls /api on its own origin, so the API is proxied here rather than named in
# the JavaScript — the address of the API is deployment, not code.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed file names, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
